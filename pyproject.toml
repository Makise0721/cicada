[project]
name = "cicada"
version = "0.1.0"
description = "Cicada coding agent: kernel / plugin runtime / coding capabilities"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "pyyaml>=6.0.1",
    "tokenizers==0.23.3",
]

[project.scripts]
cicada = "cicada.__main__:console_main"

[project.optional-dependencies]
benchmark = ["pyarrow==26.0.0"]
# TUI 第一版 (探针裁决的发布版本): 仅交互终端入口需要, 无 UI 模式不导入
tui = [
    "prompt_toolkit>=3.0.53",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cicada"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
